name: zumbarl-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zumbarl
      POSTGRES_PASSWORD: zumbarl
      POSTGRES_DB: zumbarl_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zumbarl -d zumbarl_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56380:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

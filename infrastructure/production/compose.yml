name: zumbarl-production

x-backend-environment: &backend-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: 4100
  BACKGROUND_JOBS_MODE: external

services:
  migrate:
    profiles: [release]
    build:
      context: ../../zumbarl_backend
      target: migration
    env_file: .env.production
    environment: *backend-environment
    restart: "no"

  backend:
    build:
      context: ../../zumbarl_backend
      target: runtime
    env_file: .env.production
    environment: *backend-environment
    restart: unless-stopped
    expose: ["4100"]
    stop_grace_period: 20s

  worker:
    build:
      context: ../../zumbarl_backend
      target: worker
    env_file: .env.production
    environment: *backend-environment
    restart: unless-stopped
    stop_grace_period: 30s

  frontend:
    build:
      context: ../../zumbarl.com
      target: runtime
      args:
        VITE_ZUMBARL_API_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    expose: ["8080"]

  edge:
    image: caddy:2.10-alpine
    env_file: .env.production
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 55m;

  location = /health {
    proxy_pass http://backend:4100/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /ready {
    proxy_pass http://backend:4100/ready;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # API content downloads include their original file extension. `^~` prevents
  # the static-assets regex from shadowing those authenticated/backend routes.
  location ^~ /api/ {
    proxy_pass http://backend:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 65s;
  }

  # Uploaded public files can end in the same image/font extensions handled by
  # the static-assets regex below. `^~` keeps those requests on the backend
  # route instead of letting the regex location incorrectly return a SPA 404.
  location ^~ /files/ {
    proxy_pass http://backend:4100/api/v1/uploads/content/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
  }

  location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
  }
}

name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zumbarl
          POSTGRES_PASSWORD: zumbarl
          POSTGRES_DB: zumbarl_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zumbarl -d zumbarl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: zumbarl_backend
    env:
      NODE_ENV: test
      PORT: 4100
      HOST: 127.0.0.1
      SERVER_PUBLIC_URL: http://127.0.0.1:4100
      JITSI_PUBLIC_URL: http://127.0.0.1:18000
      DATABASE_URL: postgresql://zumbarl:zumbarl@127.0.0.1:5432/zumbarl_test?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-test-secret-that-is-at-least-32-characters
      CORS_ORIGIN: http://127.0.0.1:5173
      RATE_LIMIT_MAX: 600
      RATE_LIMIT_WINDOW: 1 minute
      EVERGREEN_QUALIFICATION_GIGS: 3
      EVERGREEN_REPEAT_HIRE_LIMIT: 3
      MPESA_BASE_URL: https://sandbox.safaricom.co.ke
      MPESA_CONSUMER_KEY: test
      MPESA_CONSUMER_SECRET: test
      MPESA_SHORT_CODE: 174379
      MPESA_PASSKEY: test
      MPESA_REQUEST_TIMEOUT_MS: 15000
      STORAGE_PROVIDER: local
      SMS_PROVIDER: disabled
      SMS_API_KEY: test
      SMS_USERNAME: test
      WHATSAPP_PROVIDER: disabled
      WHATSAPP_ACCESS_TOKEN: test
      WHATSAPP_SENDER_ID: test
      EMAIL_PROVIDER: disabled
      EMAIL_FROM: no-reply@zumbarl.test
      MAIL_HOST: localhost
      MAIL_PORT: 1025
      MAIL_SECURE: 'false'
      OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9000
      OBJECT_STORAGE_BUCKET: test
      OBJECT_STORAGE_ACCESS_KEY_ID: test
      OBJECT_STORAGE_SECRET_ACCESS_KEY: test
      OSRM_BASE_URL: http://127.0.0.1:55000
      OSRM_TIMEOUT_MS: 4000
      DELIVERY_HAVERSINE_FALLBACK_FACTOR: 1.3
      GEOCODING_BASE_URL: https://photon.komoot.io
      ANTHROPIC_MODEL: claude-opus-4-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zumbarl_backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run db:migrate:deploy
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zumbarl.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zumbarl.com/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    outputs:
      image_prefix: ${{ steps.images.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - id: images
        name: Resolve container image names
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: ./zumbarl_backend
          target: runtime
          push: true
          tags: ${{ steps.images.outputs.prefix }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and publish migration image
        uses: docker/build-push-action@v6
        with:
          context: ./zumbarl_backend
          target: migration
          push: true
          tags: ${{ steps.images.outputs.prefix }}-migration:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: ./zumbarl.com
          target: runtime
          push: true
          build-args: VITE_ZUMBARL_API_URL=/api/v1
          tags: ${{ steps.images.outputs.prefix }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      IMAGE_PREFIX: ${{ needs.package.outputs.image_prefix }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure production SSH access
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_KEY" > ~/.ssh/production
          chmod 600 ~/.ssh/production
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Authenticate production host to the registry
        shell: bash
        run: |
          printf '%s' "$GHCR_TOKEN" | \
            ssh -i ~/.ssh/production "ubuntu@$PRODUCTION_HOST" \
              'registry-login ${{ github.actor }}'
      - name: Deploy immutable release
        shell: bash
        run: |
          ssh -i ~/.ssh/production "ubuntu@$PRODUCTION_HOST" \
            "deploy ${{ github.sha }} $IMAGE_PREFIX"
      - name: Verify public readiness
        shell: bash
        run: |
          test -n "$PRODUCTION_URL"
          curl --fail --show-error --silent --retry 12 --retry-delay 5 \
            "$PRODUCTION_URL/ready" > /dev/null
      - name: Remove temporary registry credentials
        if: always()
        shell: bash
        run: |
          ssh -i ~/.ssh/production "ubuntu@$PRODUCTION_HOST" \
            'registry-logout' >/dev/null 2>&1 || true
